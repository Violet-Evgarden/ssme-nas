[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ssme-nas"
version = "1.0.0"
description = "Evolutionary neural architecture search driven by structural edit memory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
nb101 = ["google-crc32c"]
nb201 = ["nats-bench", "nas-bench-201", "torch>=2.0", "numpy"]

[tool.setuptools.packages.find]
include = ["ssme_nas*"]
